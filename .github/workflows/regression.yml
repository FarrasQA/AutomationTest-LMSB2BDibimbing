name: Automation Regression Test

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  automation-test:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Run Full Regression
        run: ./gradlew clean test -Dsuite=testng.xml
        continue-on-error: true

      ##########################################################
      # DEBUG REPORT
      ##########################################################

      - name: Verify Generated Report
        if: always()
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo ""
          echo "========== REPORTS =========="
          ls -lah reports || true

          echo ""
          echo "========== REPORT FILES =========="
          find reports -type f || true

      ##########################################################
      # READ SUMMARY
      ##########################################################

      - name: Read Summary
        if: always()
        run: |
          PASSED=$(grep PASSED reports/summary.txt | cut -d '=' -f2 || echo "0")
          FAILED=$(grep FAILED reports/summary.txt | cut -d '=' -f2 || echo "0")
          SKIPPED=$(grep SKIPPED reports/summary.txt | cut -d '=' -f2 || echo "0")

          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV

          if [ "$FAILED" -eq "0" ]; then
            echo "COLOR=#2EB67D" >> $GITHUB_ENV
            echo "STATUS_MSG=SUCCESS ✅" >> $GITHUB_ENV
          else
            echo "COLOR=#E01E5A" >> $GITHUB_ENV
            echo "STATUS_MSG=FAILED ❌" >> $GITHUB_ENV
          fi

      ##########################################################
      # SAVE REPORT ARTIFACT
      ##########################################################

      - name: Upload Extent Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/
          if-no-files-found: error

      - name: Upload Failed Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots/
          if-no-files-found: ignore

      ##########################################################
      # DEPLOY TO GITHUB PAGES
      ##########################################################

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      ##########################################################
      # SLACK NOTIFICATION
      ##########################################################

      - name: Send Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "attachments": [
                {
                  "color": "${{ env.COLOR }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚀 Automation Regression Result"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Status:* ${{ env.STATUS_MSG }}\n\n✅ *Passed:* ${{ env.PASSED }}\n❌ *Failed:* ${{ env.FAILED }}\n⚠️ *Skipped:* ${{ env.SKIPPED }}"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "🌐 *Extent Report*\n<${{ steps.deployment.outputs.page_url }}|Open Interactive Report>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      ##########################################################
      # FAILED SCREENSHOTS TO SLACK
      ##########################################################

      - name: Upload Failed Screenshots To Slack
        if: env.FAILED > 0
        uses: MeilCli/slack-upload-file@v4
        with:
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          file_path: reports/screenshots/*.png
          initial_comment: "📸 Failed Test Evidence"